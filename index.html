<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>이민기T</title>
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이민기T">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#14213d;overflow:hidden}
  /* 앱(구글 웹앱)을 화면 가득 넣는다. 위쪽 안전영역(노치)만큼 남색으로 비워 둔다 */
  #app{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#14213d}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;transition:opacity .4s}
  #splash b{font-size:44px;font-weight:900;letter-spacing:-.04em}
  #splash b span{color:#e3b23c}
  #splash i{font-style:normal;font-size:13px;letter-spacing:.3em;color:#c9d3e6}
  #splash.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><b>이민기<span>T</span></b><i>MATH CLASS</i></div>
<iframe id="app" title="이민기T"
  src="https://script.google.com/macros/s/AKfycbz13-kutirHs2bIl38bjfH0FqZi6k8DYcjCaq7r0RHzfqxrxwd2ywtv2IpZiVLV6bleYQ/exec"
  allow="clipboard-write"></iframe>
<script>
  // 앱이 뜨면 시작 화면을 걷는다 (최대 6초)
  var f=document.getElementById('app'), s=document.getElementById('splash');
  function hide(){ setTimeout(function(){ s.classList.add('off'); }, 600); }
  f.addEventListener('load', hide); setTimeout(hide, 6000);

  // 휴대폰 뒤로가기 = 앱 안 이전 화면. 앱이 화면을 옮길 때마다 기록을 하나씩 쌓고,
  // 뒤로가기가 눌리면 앱에 "이전 화면으로" 신호를 보낸다.
  var appWin=null;
  function okOrigin(o){ return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o) || o==='https://script.google.com'; }
  window.addEventListener('message', function(e){
    if(!okOrigin(e.origin) || !e.data || typeof e.data!=='object') return;
    if(e.data.gz==='hello'){ appWin=e.source; e.source.postMessage({gz:'wrap'}, e.origin); appOrigin=e.origin; }
    else if(e.data.gz==='push'){ history.pushState({gz:1}, ''); }
    else if(e.data.gz==='back'){ history.back(); }
  });
  var appOrigin='*';
  window.addEventListener('popstate', function(){
    if(appWin) appWin.postMessage({gz:'pop'}, appOrigin);
  });
</script>
</body>
</html>
