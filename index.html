<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>이민기T</title>
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이민기T">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#14213d;overflow:hidden}
  /* 앱(구글 웹앱)을 화면 가득 넣는다. 위쪽 안전영역(노치)만큼 남색으로 비워 둔다 */
  #app{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#14213d}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;transition:opacity .4s}
  #splash b{font-size:44px;font-weight:900;letter-spacing:-.04em}
  #splash b span{color:#e3b23c}
  #splash i{font-style:normal;font-size:13px;letter-spacing:.3em;color:#c9d3e6}
  #splash.off{opacity:0;pointer-events:none}
  /* 알림 받기 안내 */
  #pushBox{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:9;background:#fff;border-radius:16px;
    box-shadow:0 8px 28px rgba(10,20,40,.28);padding:14px;font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#14213d;max-width:480px;margin:0 auto}
  #pushBox b{display:block;font-size:15px;margin-bottom:4px}
  #pushBox p{margin:0;font-size:13px;line-height:1.5;color:#5b6475}
  #pushBox .r{display:flex;gap:8px;margin-top:12px}
  #pushBox button{flex:1;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:700;background:#14213d;color:#fff;font-family:inherit}
  #pushBox button.g{background:#eef0f3;color:#5b6475}
</style>
<script src="fb-config.js"></script>
</head>
<body>
<div id="splash"><b>이민기<span>T</span></b><i>MATH CLASS</i></div>
<iframe id="app" title="이민기T"
  src="https://script.google.com/macros/s/AKfycbz13-kutirHs2bIl38bjfH0FqZi6k8DYcjCaq7r0RHzfqxrxwd2ywtv2IpZiVLV6bleYQ/exec"
  allow="clipboard-write"></iframe>
<script>
  // 앱이 뜨면 시작 화면을 걷는다 (최대 6초)
  var f=document.getElementById('app'), s=document.getElementById('splash');
  function hide(){ setTimeout(function(){ s.classList.add('off'); }, 600); }
  f.addEventListener('load', hide); setTimeout(hide, 6000);

  // 휴대폰 뒤로가기 (v2): 기록 하나(guard)를 늘 깔아 두고, 뒤로가기가 눌리면 다시 깔면서 앱에 "pop"을 보낸다.
  // 앱이 메뉴 안 한 단계 위로 가거나, 맨 처음 화면이면 "종료할까요?"를 묻는다. 종료를 고르면 guard를 걷고 한 번 더 뒤로 간다.
  var appWin=null, appOrigin='*', armed=false, exiting=false;
  function okOrigin(o){ return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o) || o==='https://script.google.com'; }
  function arm(){ if(!armed){ history.pushState({gz:1}, ''); armed=true; } }
  arm();
  window.addEventListener('message', function(e){
    if(!okOrigin(e.origin) || !e.data || typeof e.data!=='object') return;
    if(e.data.gz==='hello'){ appWin=e.source; appOrigin=e.origin; e.source.postMessage({gz:'wrap', v:3}, e.origin); }
    else if(e.data.gz==='arm'){ exiting=false; arm(); }
    else if(e.data.gz==='exit'){ exiting=true; armed=false; history.back(); setTimeout(function(){ history.back(); try{ window.close(); }catch(x){} }, 80); }
    else if(e.data.gz==='push'){ onPushAsk(!!e.data.force); }
    else if(e.data.gz==='reload'){ f.src=f.src.split('?')[0]+'?v='+Date.now(); }
  });
  // ───── 휴대폰 알림 (웹 푸시) ─────
  // 앱이 학생 로그인 뒤 {gz:'push'}를 보내면: 이미 허용 → 토큰을 앱에 전달 / 아직 → "알림 받기" 안내 / 아이폰(홈 화면 앱 아님) → 홈 화면 추가 안내
  var FBV='10.12.2', fbMsg=null;
  function pushCfg(){ return !!(self.FB_CFG && self.FB_CFG.apiKey && self.FB_VAPID) && 'serviceWorker' in navigator; }
  function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
  function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
  function later(k,days){ try{ var t=+localStorage.getItem(k)||0; return Date.now()-t < days*864e5; }catch(x){ return false; } }
  function mark(k){ try{ localStorage.setItem(k, String(Date.now())); }catch(x){} }
  function loadJs(src){ return new Promise(function(ok,no){ var t=document.createElement('script'); t.src=src; t.onload=ok; t.onerror=no; document.head.appendChild(t); }); }
  function getTok(){
    return navigator.serviceWorker.register('sw.js').then(function(reg){
      return (window.firebase ? Promise.resolve() : loadJs('https://www.gstatic.com/firebasejs/'+FBV+'/firebase-app-compat.js')
        .then(function(){ return loadJs('https://www.gstatic.com/firebasejs/'+FBV+'/firebase-messaging-compat.js'); }))
      .then(function(){
        if(!fbMsg){ firebase.initializeApp(self.FB_CFG); fbMsg=firebase.messaging();
          fbMsg.onMessage(function(p){ var d=p.data||{}; reg.showNotification(d.title||'이민기T',{body:d.body||'',icon:'icon-192.png',data:{url:d.url||'./'}}); }); }
        return fbMsg.getToken({ vapidKey: self.FB_VAPID, serviceWorkerRegistration: reg });
      });
    });
  }
  // 토큰 받기: 15초 넘게 걸리면 실패로 보고, 직접 누른 경우(force)엔 진행·실패를 화면에 보여 준다
  function sendTok(force){
    if(force) box('🔔 알림 등록 중…', '잠시만 기다려 주세요.', '닫기');
    var to=new Promise(function(_,no){ setTimeout(function(){ no(new Error('timeout')); }, 15000); });
    Promise.race([getTok(), to]).then(function(t){
      if(!t) throw new Error('no token');
      if(appWin) appWin.postMessage({gz:'pushtoken', token:t}, appOrigin);
      if(force){ var b=document.getElementById('pushBox'); if(b) b.remove(); }
    }).catch(function(e){ console.warn('push', e);
      if(force) box('🔔 알림 등록이 안 됐어요', '인터넷 연결을 확인하고 앱을 완전히 닫았다가 다시 열어 한 번 더 눌러 주세요. 계속 안 되면 민기쌤께 알려 주세요. ('+String(e && e.message || e).slice(0,60)+')', '확인'); });
  }
  function ack(force, st){ if(force && appWin) appWin.postMessage({gz:'pushack', s:st}, appOrigin); }
  var NO_PUSH='이 브라우저는 알림을 지원하지 않아요. 안드로이드는 크롬으로, 아이폰은 홈 화면에 추가한 이민기T 아이콘으로 열어 주세요.';
  function box(title, text, yes, no, onYes, onNo){
    var old=document.getElementById('pushBox'); if(old) old.remove();
    var b=document.createElement('div'); b.id='pushBox';
    b.innerHTML='<b>'+title+'</b><p>'+text+'</p><div class="r">'+(no?'<button class="g" id="pbNo">'+no+'</button>':'')+'<button id="pbYes">'+yes+'</button></div>';
    document.body.appendChild(b);
    document.getElementById('pbYes').onclick=function(){ b.remove(); if(onYes) onYes(); };
    if(no) document.getElementById('pbNo').onclick=function(){ b.remove(); if(onNo) onNo(); };
  }
  // force = 학생이 앱 홈의 [알림 켜기]를 직접 누름 → '나중에'·안내 기록과 상관없이 바로 묻고, 막혀 있으면 푸는 방법을 알려 준다
  function onPushAsk(force){
    ack(force, 'ok');
    if(!pushCfg()){ if(force) box('🔔 알림을 켤 수 없어요', NO_PUSH, '확인'); return; }
    if(isIOS() && !standalone()){
      if(!force && later('gz_ios_tip',7)) return;
      box('🔔 아이폰에서 알림 받기', '아래 공유 버튼(⬆︎) → <b style="display:inline;font-size:13px">홈 화면에 추가</b>를 누른 뒤, 홈 화면의 이민기T 아이콘으로 열면 새 과제·공지·미흡 알림을 받을 수 있어요. (iOS 16.4 이상)',
        '알겠어요', null, function(){ mark('gz_ios_tip'); });
      return;
    }
    if(!('Notification' in window)){ if(force) box('🔔 알림을 켤 수 없어요', NO_PUSH, '확인'); return; }
    if(Notification.permission==='granted'){ sendTok(force); return; }
    if(Notification.permission==='denied'){
      if(force) box('🔔 알림이 차단되어 있어요', isIOS() ? '아이폰 <b style="display:inline;font-size:13px">설정 → 알림 → 이민기T</b>에서 알림 허용을 켠 뒤 앱을 다시 열어 주세요.'
        : '주소창 왼쪽 아이콘(또는 ⋮ → 설정 → 사이트 설정) → <b style="display:inline;font-size:13px">알림 → 허용</b>으로 바꾼 뒤 앱을 다시 열어 주세요.', '확인');
      return;
    }
    if(!force && later('gz_push_later',3)) return;
    box('🔔 휴대폰 알림을 받을까요?', '새 과제, 민기쌤 공지, 미흡 항목, 마감 전날 미완료 과제를 알려 드려요.', '알림 받기', '나중에',
      function(){ Notification.requestPermission().then(function(p){ if(p==='granted') sendTok(force); }); },
      function(){ mark('gz_push_later'); });
  }

  window.addEventListener('popstate', function(){
    if(exiting) return;
    armed=false; arm();
    if(appWin) appWin.postMessage({gz:'pop'}, appOrigin);
  });
</script>
</body>
</html>
